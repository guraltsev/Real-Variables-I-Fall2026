<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">Open rectangle covers for a rectangular complement in dimensions one and two</title>
  <desc id="description">Two clean diagrams show an open rectangle R inside an open rectangle Q. Teal is U, the intersection of Q and R. Dashed red rectangles V cover the part of Q outside R. The one-dimensional diagram uses two intervals, and the two-dimensional diagram uses four rectangles.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#536273"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172435">
    <text x="550" y="48" text-anchor="middle" font-size="30" font-weight="700">Covering the part of Q outside R by open rectangles</text>
  </g>

  <!-- Dimension-one panel -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="55" y="90" width="455" height="340" rx="18" fill="#f8fafc" stroke="#c7d1dc" stroke-width="3"/>
    <text x="82" y="130" font-size="28" font-weight="700" fill="#172435">d = 1</text>
    <text x="82" y="164" font-size="19" fill="#536273">two open intervals</text>

    <rect x="100" y="244" width="365" height="72" rx="10" fill="#ffffff" stroke="#26384a" stroke-width="5"/>
    <rect x="108" y="252" width="140" height="56" rx="7" fill="#df4b4b" fill-opacity="0.13" stroke="#bd3e3e" stroke-width="4" stroke-dasharray="10 7"/>
    <rect x="316" y="252" width="140" height="56" rx="7" fill="#df4b4b" fill-opacity="0.13" stroke="#bd3e3e" stroke-width="4" stroke-dasharray="10 7"/>
    <rect x="246" y="248" width="72" height="64" rx="6" fill="#4fae9d" fill-opacity="0.78" stroke="#206a60" stroke-width="4"/>
    <rect x="246" y="248" width="72" height="64" rx="6" fill="none" stroke="#a66f00" stroke-width="5"/>

    <text x="177" y="286" text-anchor="middle" font-size="22" font-weight="700" fill="#a82c2c">V<tspan baseline-shift="sub" font-size="15">1</tspan></text>
    <text x="386" y="286" text-anchor="middle" font-size="22" font-weight="700" fill="#a82c2c">V<tspan baseline-shift="sub" font-size="15">2</tspan></text>
    <text x="282" y="286" text-anchor="middle" font-size="20" font-weight="700" fill="#174e47">U</text>
    <text x="111" y="230" font-size="23" font-style="italic" fill="#26384a">Q</text>
    <line x1="283" y1="220" x2="283" y2="239" stroke="#536273" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="283" y="208" text-anchor="middle" font-size="22" font-style="italic" fill="#8a5d00">R</text>
    <text x="283" y="365" text-anchor="middle" font-size="21" fill="#26384a">U = Q &#x2229; R</text>
    <text x="283" y="397" text-anchor="middle" font-size="19" fill="#536273">V<tspan baseline-shift="sub" font-size="13">1</tspan> and V<tspan baseline-shift="sub" font-size="13">2</tspan> cover Q &#x2229; R<tspan baseline-shift="super" font-size="13">c</tspan></text>
  </g>

  <!-- Dimension-two panel -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="545" y="90" width="500" height="340" rx="18" fill="#f8fafc" stroke="#c7d1dc" stroke-width="3"/>
    <text x="574" y="130" font-size="28" font-weight="700" fill="#172435">d = 2</text>
    <text x="574" y="164" font-size="19" fill="#536273">four open rectangles</text>

    <rect x="650" y="184" width="310" height="185" rx="8" fill="#ffffff" stroke="#26384a" stroke-width="5"/>
    <rect x="658" y="192" width="96" height="169" rx="4" fill="#df4b4b" fill-opacity="0.13" stroke="#bd3e3e" stroke-width="4" stroke-dasharray="10 7"/>
    <rect x="856" y="192" width="96" height="169" rx="4" fill="#df4b4b" fill-opacity="0.13" stroke="#bd3e3e" stroke-width="4" stroke-dasharray="10 7"/>
    <rect x="752" y="192" width="106" height="55" rx="4" fill="#df4b4b" fill-opacity="0.13" stroke="#bd3e3e" stroke-width="4" stroke-dasharray="10 7"/>
    <rect x="752" y="305" width="106" height="56" rx="4" fill="#df4b4b" fill-opacity="0.13" stroke="#bd3e3e" stroke-width="4" stroke-dasharray="10 7"/>
    <rect x="752" y="245" width="106" height="62" rx="5" fill="#4fae9d" fill-opacity="0.78" stroke="#206a60" stroke-width="4"/>
    <rect x="752" y="245" width="106" height="62" rx="5" fill="none" stroke="#a66f00" stroke-width="5"/>

    <text x="706" y="283" text-anchor="middle" font-size="22" font-weight="700" fill="#a82c2c">V<tspan baseline-shift="sub" font-size="15">1</tspan></text>
    <text x="904" y="283" text-anchor="middle" font-size="22" font-weight="700" fill="#a82c2c">V<tspan baseline-shift="sub" font-size="15">2</tspan></text>
    <text x="775" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#a82c2c">V<tspan baseline-shift="sub" font-size="15">3</tspan></text>
    <text x="805" y="342" text-anchor="middle" font-size="22" font-weight="700" fill="#a82c2c">V<tspan baseline-shift="sub" font-size="15">4</tspan></text>
    <text x="805" y="283" text-anchor="middle" font-size="21" font-weight="700" fill="#174e47">U</text>
    <text x="662" y="175" font-size="23" font-style="italic" fill="#26384a">Q</text>
    <line x1="877" y1="203" x2="853" y2="239" stroke="#536273" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="882" y="199" text-anchor="middle" font-size="22" font-style="italic" fill="#8a5d00">R</text>
    <text x="805" y="397" text-anchor="middle" font-size="21" fill="#26384a">U = Q &#x2229; R</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536273">
    <rect x="77" y="478" width="946" height="49" rx="12" fill="#f1f5f9"/>
    <rect x="101" y="492" width="32" height="20" rx="3" fill="#4fae9d" fill-opacity="0.78" stroke="#206a60" stroke-width="2"/>
    <text x="143" y="509">U = Q &#x2229; R</text>
    <rect x="348" y="492" width="32" height="20" rx="3" fill="#df4b4b" fill-opacity="0.13" stroke="#bd3e3e" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="390" y="509">dashed V<tspan baseline-shift="sub" font-size="13">r</tspan> are the open covers of Q &#x2229; R<tspan baseline-shift="super" font-size="13">c</tspan></text>
    <line x1="787" y1="502" x2="819" y2="502" stroke="#a66f00" stroke-width="4"/>
    <text x="831" y="509">boundary of R</text>
  </g>
</svg>
